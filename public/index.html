<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Forge — AI Web Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0f1115;--p:#171a21;--b:#2a2f3a;--t:#e8eaf0;--m:#8b93a7;--a:#7c5cff;--a2:#22d3ee;--r:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6fa;--p:#fff;--b:#dde0ea;--t:#171a21;--m:#667}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,var(--a),var(--a2));border:0;color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.btn.g{background:var(--p);border:1px solid var(--b);color:var(--t)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:9px;padding:10px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--a)}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--b);background:var(--p);flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--b);color:var(--m)}
main{flex:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--b);min-height:0}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{padding:9px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.m.u{background:var(--a);color:#fff;align-self:flex-end}.m.a{background:var(--p);border:1px solid var(--b)}
.in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--b)}.in textarea{resize:none;height:46px}
.pv{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--b);align-items:center}
.tab{padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--m);border:0;background:none}.tab.on{background:var(--p);color:var(--t);border:1px solid var(--b)}
iframe{flex:1;border:0;background:#fff;width:100%}
#code{flex:1;margin:0;padding:12px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
.card h2{margin:0}.err{color:var(--r);font-size:13px;min-height:18px}.note{font-size:12px;color:var(--m)}
.code{background:var(--bg);border:1px dashed var(--a);border-radius:9px;padding:10px;text-align:center;font-size:13px}
.code b{font-size:22px;letter-spacing:4px;color:var(--a2)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--b);background:var(--p);cursor:pointer;color:var(--m)}.chip:hover{border-color:var(--a);color:var(--t)}
.att{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}.att:empty{display:none}.at{position:relative;border:1px solid var(--b);border-radius:9px;padding:4px 8px 4px 4px;display:flex;align-items:center;gap:6px;font-size:12px;background:var(--p);max-width:170px}
.at img{width:32px;height:32px;object-fit:cover;border-radius:6px}.at span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.at b{cursor:pointer;color:var(--r)}
.ic{background:var(--p);border:1px solid var(--b);border-radius:9px;width:42px;cursor:pointer}
#stage{flex:1;display:flex;justify-content:center;background:repeating-conic-gradient(var(--p) 0 25%,var(--bg) 0 50%) 0 0/20px 20px;min-height:0}
#stage iframe{flex:none;height:100%;transition:width .25s}.drop{outline:3px dashed var(--a2);outline-offset:-6px}
.dev{padding:4px 9px;font-size:12px}.sm{padding:5px 10px;font-size:12px}
body.home #undo,body.home #redo,body.home #open,body.home #copy,body.home #dl,body.home #newBtn,body.home main{display:none!important}body:not(.home) #home{display:none}
#home{flex:1;overflow:auto}.hw{max-width:1040px;margin:0 auto;padding:28px 18px 60px}.hw h1{font-size:clamp(26px,5vw,40px);margin:0 0 4px}.hw h3{margin:30px 0 12px;font-size:16px}
.hbox{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:12px;margin-top:18px;box-shadow:0 8px 30px rgba(124,92,255,.12)}.hbox textarea{border:0;height:84px;resize:none;background:transparent}.hrow{display:flex;gap:10px;align-items:center;padding-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pc,.tc{background:var(--p);border:1px solid var(--b);border-radius:14px;cursor:pointer;overflow:hidden;transition:.15s}.pc:hover,.tc:hover{border-color:var(--a);transform:translateY(-2px)}
.th{height:130px;overflow:hidden;position:relative;background:#fff}.th iframe{width:1200px;height:780px;transform:scale(.18);transform-origin:0 0;pointer-events:none;border:0;flex:none}
.pi{padding:10px 12px}.pi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pa{display:flex;gap:6px;margin-top:8px}
.tc{padding:14px}.tc .e{font-size:26px}.tc b{display:block;margin-top:4px}
body.drop::after{content:'⬆ Drop images or files to attach';position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:rgba(124,92,255,.4);backdrop-filter:blur(3px);z-index:30;pointer-events:none;color:#fff}
.sw{display:inline-block;width:56px;height:56px;border-radius:10px;margin:3px;cursor:pointer;border:1px solid var(--b);font-size:9px;color:#fff;text-shadow:0 0 3px #000;text-align:center;line-height:56px}
.card.w{max-width:780px}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pl{border:1px solid var(--b);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}.pl.hot{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 8px 28px rgba(124,92,255,.25)}
.pl ul{margin:0;padding-left:18px;font-size:13px;color:var(--m);flex:1}.pl h3{margin:0}.pr{font-size:26px;font-weight:800}.pr small{font-size:12px;color:var(--m);font-weight:400}.tag{position:absolute;top:-10px;right:12px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:11px;padding:2px 10px;border-radius:99px}
#home{background:radial-gradient(900px 420px at 12% -8%,rgba(124,92,255,.28),transparent 70%),radial-gradient(700px 360px at 95% 0,rgba(34,211,238,.2),transparent 70%)}
.hw h1{background:linear-gradient(135deg,var(--t),var(--a2) 60%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hbox:focus-within{border-color:var(--a);box-shadow:0 8px 40px rgba(124,92,255,.3)}
.tc:hover{box-shadow:0 8px 24px rgba(124,92,255,.22)}.tc.own{border-style:dashed;border-color:var(--a2)}
.sel{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:6px;color:var(--t);font-size:12px;max-width:190px}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--a)}.dots i.f{background:var(--a2);border-color:var(--a2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{padding:14px;font-size:20px;border-radius:12px;border:1px solid var(--b);background:var(--bg);cursor:pointer}.pad button:active{background:var(--a)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
:root[data-theme="light"]{--bg:#f5f6fa;--p:#fff;--b:#dde0ea;--t:#171a21;--m:#667}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--b);font-size:14px}.sh{font-size:11px;letter-spacing:.08em;color:var(--m);margin:10px 0 0}
</style></head><body>
<div id="app">
<header><button class="btn g sm" id="homeBtn">🏠 Home</button><button class="btn g sm" id="upBtn">💎 Plans</button><span class="logo">⚡ Forge</span><span class="pill" id="status"></span><select id="mdl" class="sel" title="Choose AI"></select><span class="sp"></span>
<button class="btn g hide" id="adminBtn">Admin</button><button class="btn g sm" id="undo" title="Undo">↶</button><button class="btn g sm" id="redo" title="Redo">↷</button><button class="btn g sm hide" id="open">Open ↗</button><button class="btn g sm hide" id="copy">Copy</button><button class="btn g hide" id="dl">Download</button>
<button class="btn g" id="newBtn">New</button><button class="btn g sm" id="setBtn" title="Settings">⚙️</button><button class="btn" id="authBtn">Sign in</button></header>
<div id="home"><div class="hw"><h1 id="hg"></h1><div class="note">Describe it, drop in images, and Forge builds it live.</div><div class="stats" id="stats"></div>
<div class="hbox"><div class="att" id="hatt"></div><textarea id="hin" placeholder="Build me a… (drag & drop images or files anywhere to attach them)"></textarea><div class="hrow"><button class="ic" id="hclip" title="Attach">📎</button><span class="note">Drag &amp; drop works anywhere</span><span class="sp"></span><button class="btn g sm" id="sur">🎲 Surprise me</button><button class="btn" id="hgo">Build it ⚡</button></div></div>
<h3>📁 Your projects</h3><div class="grid" id="pg"></div><h3>🧩 Start from a template</h3><div class="grid" id="tg"></div><h3>🛠 Tools</h3><div class="grid" id="toolg"></div></div></div>
<main>
<section class="chat"><div id="msgs"></div>
<div class="chips" id="chips"></div><div class="att" id="att"></div>
<div class="in"><button class="ic" id="clip" title="Attach images or files">📎</button><textarea id="inp" placeholder="Describe what to build, or attach files and tell me what to do with them…"></textarea><button class="btn" id="send">Send</button></div><input type="file" id="file" multiple hidden></section>
<section class="pv"><div class="tabs"><button class="tab on" data-t="p">Preview</button><button class="tab" data-t="c">Code</button><button class="tab dev" data-w="100%">🖥</button><button class="tab dev" data-w="768px">▭</button><button class="tab dev" data-w="390px">📱</button><span class="sp"></span><span class="note" id="ver"></span></div>
<div id="stage"><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals" title="preview" style="width:100%"></iframe></div><pre id="code"></pre></section>
</main>
<input type="file" id="hfile" multiple hidden></div>
<div id="modal"></div>
<script>// ---------- storage (localStorage, guarded) ----------
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FREE=5;
let users=S.get('forge_users',{}), session=S.get('forge_session',null), guestUsed=S.get('forge_guest',0); if(session&&session.admin)session=null;
let projects=S.get('forge_projects',[]), cur=null, curName='', pending=null, html='', history=[], busy=false, assets={}, assetN=0, attach=[], versions=[], vi=-1, ctrl=null;
const ADMIN={u:'ADMINREAL',p:'ADMINADMIN11'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('forge:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
const saveUsers=()=>S.set('forge_users',users);

// ---------- UI ----------
function addMsg(role,text){const d=document.createElement('div');d.className='m '+role;d.textContent=text;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
const plan=()=>{if(!session)return 'guest';if(session.admin)return 'business';const u=users[session.u]||{};if(u.until&&Date.now()>u.until){u.plan='free';u.until=0;saveUsers()}return u.plan||'free'};const paid=()=>plan()==='pro'||plan()==='business';
const WIN=48*3600*1e3;
function qState(){if(session&&session.admin||paid())return null;let q;if(session){const h=users[session.u];if(!h)return null;q=h.q=h.q||{n:0,t:0}}else q=S.get('forge_gq',{n:0,t:0});if(q.n&&Date.now()-q.t>WIN){q.n=0;q.t=0}return q}
const canSend=()=>{const q=qState();return !q||q.n<FREE};
function useOne(){const q=qState();if(!q)return;if(!q.n)q.t=Date.now();q.n++;if(!session)S.set('forge_gq',q)}
function qLabel(){const q=qState();if(!q)return session&&session.admin?'Admin · unlimited':plan()+' · unlimited';return (session?'Free':'Guest')+' · '+Math.max(0,FREE-q.n)+'/'+FREE+' messages'+(q.n?' · resets in '+Math.ceil((q.t+WIN-Date.now())/36e5)+'h':'')}
function refresh(){if($('hg'))$('hg').textContent=session?'Welcome back, '+(session.admin?'Admin':session.u.split('@')[0])+' 👋':'What will you build today?';
  const s=session; $('authBtn').textContent=s?'Sign out':'Sign in';
  $('adminBtn').classList.toggle('hide',!(s&&s.admin));
  $('status').textContent=qLabel();
}
function saveProj(){if(!cur||!html)return;const i=projects.findIndex(p=>p.id===cur),p={id:cur,name:curName||'Untitled',html,assets,assetN,updated:Date.now()};i>=0?projects[i]=p:projects.unshift(p);S.set('forge_projects',projects)}
const rend=(h,a)=>h.replace(/\{\{(IMG\d+)\}\}/g,(m,k)=>a[k]||m);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
function go(v){document.body.classList.toggle('home',v==='home');if(v==='home')renderHome();else show()}
function newProject(prompt,files){if(!paid()&&projects.length>=5){return pricing('You\'ve reached 5 saved projects. Upgrade for unlimited, or delete one.')}cur='p'+Date.now();curName='';html='';history=[];assets=files?assets:{};assetN=files?assetN:0;versions=[];vi=-1;$('msgs').innerHTML='';addMsg('a','New project. Describe what to build — attach images or files any time.');go('build');if(prompt){$('inp').value=prompt;send()}}
function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;cur=id;curName=p.name;assets=p.assets||{};assetN=p.assetN||0;history=[];versions=[p.html];vi=0;html=p.html;attach=[];renderAtt();$('msgs').innerHTML='';addMsg('a','Opened "'+p.name+'". What should we change?');go('build')}
const rendered=()=>rend(html,assets);
function show(){const on=!!html;$('frame').srcdoc=rendered();$('code').textContent=html;['dl','open','copy'].forEach(i=>$(i).classList.toggle('hide',!on));$('ver').textContent=on?(Math.round(html.length/102.4)/10+' KB · v'+(vi+1)+'/'+versions.length):'';$('undo').disabled=vi<=0;$('redo').disabled=vi>=versions.length-1}
function setHtml(h,push=true){html=h;if(push){versions=versions.slice(0,vi+1);versions.push(h);if(versions.length>30)versions.shift();vi=versions.length-1}show();saveProj()}
$('undo').onclick=()=>{if(vi>0){vi--;setHtml(versions[vi],false)}};$('redo').onclick=()=>{if(vi<versions.length-1){vi++;setHtml(versions[vi],false)}};
$('copy').onclick=()=>{try{navigator.clipboard.writeText(rendered());$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy',1200)}catch(e){}};
$('open').onclick=()=>{const w=window.open();if(w){w.document.write(rendered());w.document.close()}};
function modal(inner){$('modal').innerHTML='<div class="ov"><div class="card">'+inner+'</div></div>'}
const closeModal=()=>$('modal').innerHTML='';

// ---------- auth ----------
function authForm(mode,err=''){
  const up=mode==='up';
  modal(`<h2>${up?'Create account':'Sign in'}</h2><div class="note">${up?'Create a free account to save your projects.':'Welcome back.'}</div>
  <input id="e" placeholder="${up?'Email':'Email or username'}" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="${up?'new-password':'current-password'}">
  <div class="err">${esc(err)}</div><button class="btn" id="go">${up?'Send verification code':'Sign in'}</button>
  <button class="btn g" id="sw">${up?'I have an account':'Create an account'}</button><button class="btn g" id="x">Close</button>`);
  $('x').onclick=closeModal;$('sw').onclick=()=>authForm(up?'in':'up');
  $('go').onclick=()=>up?signUp($('e').value.trim().toLowerCase(),$('p').value):signIn($('e').value.trim(),$('p').value);
}
async function signUp(e,p){
  if(!/^\S+@\S+\.\S+$/.test(e))return authForm('up','Enter a valid email.');
  if(p.length<8)return authForm('up','Password must be 8+ characters.');
  if(users[e]&&users[e].verified)return authForm('up','Account exists. Sign in instead.');
  const code=String(Math.floor(100000+Math.random()*900000));
  pending={e,h:await hash(p),code};verifyForm();
}
function verifyForm(err=''){
  modal(`<h2>Verify your email</h2><div class="note">We sent a 6-digit code to <b>${esc(pending.e)}</b>. Check your inbox — and your junk/spam folder too.</div>
  <div class="code">Demo inbox — your code:<br><b>${pending.code}</b><div class="note">Demo mode: this page can't send real email yet, so the code is shown here instead.</div></div>
  <input id="c" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code"><div class="err">${esc(err)}</div>
  <button class="btn" id="go">Verify</button><button class="btn g" id="x">Cancel</button>`);
  $('x').onclick=closeModal;
  $('go').onclick=()=>{
    if($('c').value.trim()!==pending.code)return verifyForm('Wrong code.');
    users[pending.e]={h:pending.h,verified:true,msgs:0,joined:Date.now()};saveUsers();
    session={u:pending.e,admin:false};S.set('forge_session',session);pending=null;closeModal();refresh();
    addMsg('a','✅ Verified! Welcome to Forge. What should we make?');
  };
}
async function signIn(u,p){
  if(u===ADMIN.u&&p===ADMIN.p){return pinPad(()=>{session={u:ADMIN.u,admin:true};closeModal();refresh();if($('stats'))renderHome();addMsg('a','Welcome back, admin. 🔓')})}
  const k=u.toLowerCase(),usr=users[k];
  if(!usr||usr.h!==await hash(p))return authForm('in','Invalid credentials.');
  session={u:k,admin:false};S.set('forge_session',session);closeModal();refresh();addMsg('a','Signed in. Welcome back!');
}
$('authBtn').onclick=()=>{if(session){session=null;S.set('forge_session',null);refresh()}else authForm('in')};

// ---------- admin ----------
$('adminBtn').onclick=()=>{
  const rows=Object.entries(users).map(([e,u])=>`<tr><td>${esc(e)}</td><td>${u.plan||'free'}</td><td>${u.msgs||0}</td><td>${u.pay&&u.pay.status==='pending'?`<button class="btn sm" data-ap="${esc(e)}">Accept ${u.pay.plan}</button> <button class="btn g sm" data-dc="${esc(e)}">Decline</button> `:''}<button class="btn g" data-del="${esc(e)}">Delete</button></td></tr>`).join('')||'<tr><td colspan=4 class="note">No users yet.</td></tr>';
  modal(`<h2>Admin panel</h2><div class="note"><b>Activation key</b> — after a buyer DMs you, generate their key and send it back:</div><input id="ke" placeholder="buyer's email"><select id="kp" class="sel"><option value="pro">Pro</option><option value="business">Business</option></select><button class="btn sm" id="kg">Generate key</button><div id="kout"></div><div class="note">Guest messages used on this device: ${S.get('forge_gq',{n:0}).n}/${FREE}</div>
  <table><tr><th>User</th><th>Plan</th><th>Msgs</th><th></th></tr>${rows}</table>
  <button class="btn g" id="rg">Reset guest counter</button><button class="btn g" id="x">Close</button>`);
  $('x').onclick=closeModal;$('rg').onclick=()=>{S.set('forge_gq',{n:0,t:0});Object.values(users).forEach(u=>u.q={n:0,t:0});saveUsers();refresh();closeModal()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete users[b.dataset.del];saveUsers();$('adminBtn').click()});$('kg').onclick=async()=>{const e=$('ke').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return;const k=await mkKey(e,$('kp').value);$('kout').innerHTML='<div class="note">Send this to the buyer (redeemable for 7 days):</div><textarea readonly rows="3">'+k+'</textarea><button class="btn g sm" id="kc">Copy</button>';$('kc').onclick=()=>{try{navigator.clipboard.writeText(k)}catch(_){}$('kc').textContent='Copied ✓'}};
  document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{users[b.dataset.dc].pay=null;saveUsers();$('adminBtn').click()});document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const u=users[b.dataset.ap];u.plan=u.pay.plan;u.until=Date.now()+30*864e5;u.pay.status='approved';saveUsers();$('adminBtn').click()});
};

// ---------- builder ----------
const SYS=`You are Forge, an elite web developer AI. You build complete, beautiful, fully working single-file web apps/sites.

    const d = await r.json();
